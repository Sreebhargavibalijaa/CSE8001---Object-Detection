apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mot17
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [mot17]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: (.+);(.+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_stage]
            target_label: stage
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: mot17
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mot17-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mot17-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mot17-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: mot17
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: mot17
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mot17
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: mot17
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus.mot17.svc.cluster.local:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: mot17
        orgId: 1
        folder: MOT17
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: mot17
data:
  mot17.json: |
    {
      "title": "MOT17 pipeline",
      "uid": "mot17-pipeline",
      "schemaVersion": 38,
      "timezone": "browser",
      "refresh": "5s",
      "tags": ["mot17", "t4"],
      "templating": {"list": []},
      "time": {"from": "now-15m", "to": "now"},
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "p50 / p95 / p99 latency (s)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "targets": [
            {"expr": "histogram_quantile(0.50, sum by (le, stage) (rate(mot_request_latency_seconds_bucket[1m])))", "legendFormat": "p50 {{stage}}", "refId": "A"},
            {"expr": "histogram_quantile(0.95, sum by (le, stage) (rate(mot_request_latency_seconds_bucket[1m])))", "legendFormat": "p95 {{stage}}", "refId": "B"},
            {"expr": "histogram_quantile(0.99, sum by (le, stage) (rate(mot_request_latency_seconds_bucket[1m])))", "legendFormat": "p99 {{stage}}", "refId": "C"}
          ]
        },
        {
          "id": 2, "type": "timeseries", "title": "Throughput (req/s)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "sum by (stage) (rate(mot_requests_total{status=\"ok\"}[1m]))", "legendFormat": "{{stage}}", "refId": "A"}
          ]
        },
        {
          "id": 3, "type": "timeseries", "title": "Queue length",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "mot_queue_length", "legendFormat": "{{stage}}", "refId": "A"}
          ]
        },
        {
          "id": 4, "type": "timeseries", "title": "Current batch size",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "mot_batch_size", "legendFormat": "{{stage}}", "refId": "A"}
          ]
        },
        {
          "id": 5, "type": "timeseries", "title": "CPU usage (cores)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "sum by (stage) (rate(process_cpu_seconds_total[1m]))", "legendFormat": "{{stage}}", "refId": "A"}
          ]
        },
        {
          "id": 6, "type": "timeseries", "title": "Assertion pass rate",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}, "overrides": []},
          "targets": [
            {"expr": "sum by (stage) (rate(mot_assertion_total{result=\"pass\"}[5m])) / clamp_min(sum by (stage) (rate(mot_assertion_total[5m])), 1e-9)", "legendFormat": "{{stage}}", "refId": "A"}
          ]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: mot17
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: mot17
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: provisioning-ds
              mountPath: /etc/grafana/provisioning/datasources
            - name: provisioning-dash
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: provisioning-ds
          configMap:
            name: grafana-provisioning
            items:
              - key: datasources.yaml
                path: datasources.yaml
        - name: provisioning-dash
          configMap:
            name: grafana-provisioning
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: dashboards
          configMap:
            name: grafana-dashboard
